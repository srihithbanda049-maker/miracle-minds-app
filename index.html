<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#fffaf4;color:#333}
header{background:#1d6b7b;color:#fff;padding:14px 18px;border-bottom:4px solid #f9c33a;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}h2{font-size:18px;color:#1d6b7b;margin:4px 0 8px}
.wrap{max-width:720px;margin:auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
input,select,textarea{width:100%;padding:10px;margin:6px 0 10px;border:1px solid #ddd;border-radius:8px;font-size:15px}
label{font-size:13px;color:#666}
button{background:#f0714f;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer;margin-top:4px}
button.alt{background:#eee;color:#333}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
nav button{padding:8px 10px;font-size:13px;margin:0}
nav button.on{background:#0f4f5c}
.muted{color:#888;font-size:13px}
.tag{display:inline-block;background:#fde9c4;border-radius:20px;padding:2px 8px;font-size:12px}
img.g{width:100%;border-radius:8px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
p{margin:6px 0;line-height:1.45}

function login(){
 const u=$('u').value.trim().toLowerCase(),p=$('p').value;
 if(role==='admin'){
  const a=S.admins.find(a=>a.user===u&&a.pass===p);
  if(!a){msg='Wrong admin username or password';return render();}
  user={admin:true,name:a.name,user:a.user};view='admin';tab='post';saveSession({t:'a',u:a.user});
 }else{
  const c=S.children.find(c=>c.user===u&&c.pass===p);
  if(!c){msg='Wrong child username or password';return render();}
  user=c;view='parent';tab='menu';saveSession({t:'p',id:c.id});
 }
 msg='';render();
}
function logout(){localStorage.removeItem('mmp_session');user=null;view='login';msg='';render();}

// ---- PARENT VIEW ----
function parentHTML(){
 return `<div class="card" style="display:flex;align-items:center;gap:12px">${user.photo?`<img src="${user.photo}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #1d6b7b">`:`<div style="width:64px;height:64px;border-radius:50%;background:#1d6b7b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold">${esc(user.name.charAt(0).toUpperCase())}</div>`}<div style="flex:1"><b>Parent of ${esc(user.name)}</b> <span class="tag">${user.cls}</span>
  <p class="muted">${S.school.name}<br>📞 ${S.school.phone} · ✉️ ${S.school.email}</p></div></div>${tab==='menu'?menuHTML():'<button class="alt" onclick="goTab(\'menu\')">← Back to menu</button>'+pBody()}`;
}
function pBody(){
 const c=user;
 switch(tab){
  case 'ann': return S.announcements.filter(mine).map(annCard).join('')||none();
  case 'diary': return S.diary.filter(mine).map(x=>card(x.t,x.d,x.b)).join('')||none();
  case 'hw': return S.homework.filter(mine).map(x=>card(x.t,x.d,x.b)).join('')||none();
  case 'att': {
   const keys=Object.keys(S.att).filter(k=>k.startsWith(c.id+'|')).sort().reverse();
   const present=keys.filter(k=>S.att[k]==='P').length;
   const rows=keys.map(k=>`<tr><td>${k.split('|')[1]}</td><td>${S.att[k]==='P'?'✅ Present':'❌ Absent'}</td></tr>`).join('');
   return `<div class="card">Days present: <b>${present}</b></div><div class="card">${rows?`<table>${rows}</table>`:'No attendance recorded yet.'}</div>`;
  }
  case 'fees': return `<div class="card"><table><tr><th>Item</th><th>Amount</th><th>Due</th><th>Status</th></tr>${S.fees.map(f=>`<tr><td>${esc(f.term)}</td><td>${esc(f.amt)}</td><td>${f.due}</td><td>${f.status}</td></tr>`).join('')}</table></div>`||none();
  case 'forms': return S.forms.map(f=>`<div class="card"><b>${esc(f.title)}</b>${f.fields.map((x,i)=>`<label>${esc(x)}</label><input id="f${f.id}_${i}">`).join('')}<button onclick="sendForm(${f.id})">Submit</button></div>`).join('')||none();
  case 'gal': return `<div class="grid">${S.gallery.filter(mine).map(g=>`<div><img class="g" src="${g.src}"><div class="muted">${esc(g.cap)}</div></div>`).join('')||'<div class="card muted">No photos yet.</div>'}</div>`;
  case 'tt': {
   const rows=S.timetable.filter(t=>t.cls===c.cls).sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||a.time.localeCompare(b.time));
   const body=rows.map(t=>`<tr><td>${t.day}</td><td>${esc(t.time)}</td><td>${esc(t.subject)}</td></tr>`).join('');
   return body?`<div class="card"><table><tr><th>Day</th><th>Time</th><th>Activity</th></tr>${body}</table></div>`:none();
  }
  case 'concern': return `<div class="card"><h2>Parent Concern Form</h2>
    <label>Subject</label><input id="cs">
    <label>Describe your concern</label><textarea id="cm" rows="4"></textarea>
    <button onclick="sendConcern()">Submit concern</button></div>`
    + S.concerns.filter(x=>x.cid===c.id).reverse().map(x=>card(x.subject,x.d,x.message+(x.reply?'  |  School reply: '+x.reply:''))).join('');
  case 'report': {
   const rows=S.reports.filter(r=>r.cid===c.id);
   const photos=S.reportPhotos.filter(p=>p.cid===c.id);
   const terms=[...new Set([...rows.map(r=>r.term),...photos.map(p=>p.term)])];
   if(!terms.length) return none();
   return terms.map(t=>`<div class="card"><b>${esc(t)}</b>
    ${rows.filter(r=>r.term===t).length?`<table><tr><th>Subject</th><th>Marks / Grade</th><th>Remarks</th></tr>${rows.filter(r=>r.term===t).map(r=>`<tr><td>${esc(r.subject)}</td><td>${esc(r.grade)}</td><td>${esc(r.remarks)}</td></tr>`).join('')}</table>`:''}
    ${photos.filter(p=>p.term===t).map(p=>`<img src="${p.img}" style="width:100%;border-radius:8px;margin-top:8px">`).join('')}
   </div>`).join('');
  }
  case 'leave': return `<div class="card"><h2>Apply for Leave</h2><p class="muted">Leave must be requested at least 1 day in advance.</p><label>From</label><input type="date" id="lf"><label>To</label><input type="date" id="lt"><label>Reason</label><textarea id="lr" rows="3"></textarea><button onclick="applyLeave()">Submit application</button></div>`
    + S.leaves.filter(l=>l.cid===c.id).reverse().map(l=>card(`${l.from} → ${l.to}`,l.status,l.reason)).join('');
 }
}
function sendForm(id){
 const f=S.forms.find(x=>x.id===id);
 const answers=f.fields.map((_,i)=>$('f'+id+'_'+i).value);
 S.responses.push({fid:id,name:user.name,fields:f.fields,answers,d:today()});
 alert('Thank you! Your form has been submitted.');render();
}
function applyLeave(){
 const from=$('lf').value,to=$('lt').value,reason=$('lr').value.trim();
 if(!from||!to||!reason) return alert('Please fill in both dates and the reason.');
 if(from<=today()) return alert('Leave must be applied at least 1 day in advance.');
 if(to<from) return alert('The end date cannot be before the start date.');
 S.leaves.push({cid:user.id,name:user.name,from,to,reason,status:'Pending'});
 alert('Leave application sent to the school.');render();
}

const MENU=[['ann','📢','Announcements'],['diary','📔','Class Diary'],['hw','📚','Homework'],['forms','📝','Forms'],['gal','🖼️','Gallery'],['leave','🏖️','Leave Application']];
const SIS=[['att','🙋','Attendance'],['tt','🗓️','Timetable']];
const FIN=[['fees','💰','Fee Details']];
const CON=[['concern','💬','Parent Concern Form']];

function tilesHTML(list){
 return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${list.map(([k,ic,l])=>`<div onclick="goTab('${k}')" style="cursor:pointer;background:#fffaf4;border:1px solid #eee;border-radius:12px;padding:14px 4px;text-align:center"><div style="font-size:34px">${ic}</div><div style="font-size:13px;margin-top:6px;color:#333">${l}</div></div>`).join('')}</div>`;
}
function menuHTML(){
 return `<div class="card" style="padding:12px"><h2 style="margin:4px 0 10px">Communication</h2>${tilesHTML(MENU)}</div>
 <div class="card" style="padding:12px"><h2 style="margin:4px 0 10px">SIS</h2>${tilesHTML(SIS)}</div>
 <div class="card" style="padding:12px"><h2 style="margin:4px 0 10px">Finance</h2>${tilesHTML(FIN)}</div>
 <div class="card" style="padding:12px"><h2 style="margin:4px 0 10px">Concerns</h2>${tilesHTML(CON)}</div>
 <div class="card" style="padding:12px"><h2 style="margin:4px 0 10px">Grade Book</h2>${tilesHTML(GB)}</div>`;
}

function sendConcern(){
 const subject=$('cs').value.trim(),message=$('cm').value.trim();
 if(!subject||!message) return alert('Please enter a subject and describe your concern.');
 S.concerns.push({cid:user.id,name:user.name,subject,message,d:today(),reply:''});
 alert('Your concern has been sent to the school.');render();
}
function replyConcern(i){
 const v=$('rep'+i).value.trim();
 if(!v) return alert('Please write a reply first.');
 S.concerns[i].reply=v;render();
}
function deleteConcern(i){
 if(!confirm('Delete this concern?')) return;
 S.concerns.splice(i,1);render();
}
function addReport(){
 const scl=$('rc');
 if(!scl) return alert('Please add a student first.');
 const cid=Number(scl.value),term=$('rt').value.trim(),subject=$('rs').value.trim(),grade=$('rg').value.trim(),remarks=$('rm').value.trim();
 if(!term||!subject||!grade) return alert('Please enter the term, subject and marks or grade.');
 S.reports.push({cid,term,subject,grade,remarks});alert('Report entry added.');render();
}
function deleteReport(i){
 if(!confirm('Delete this report entry?')) return;
 S.reports.splice(i,1);render();
}
function annCard(x){
 return `<div class="card"><div class="muted" style="font-size:12px">${esc(x.d)}</div>
  <b>${esc(x.t)}</b>
  <details style="margin-top:6px">
   <summary style="cursor:pointer;color:#f0714f;font-weight:bold;text-align:right;list-style:none">View More</summary>
   <p>${esc(x.b)}</p>
  </details></div>`;
}
function studentSelect(id){
 return S.children.length
  ? `<select id="${id}">${S.children.map(c=>`<option value="${c.id}">${esc(c.name)} (${esc(c.cls)})</option>`).join('')}</select>`
  : '<p class="muted">Add students first.</p>';
}
function resizeImage(file,max,cb){
 const img=new Image();
 img.onload=()=>{
  const k=Math.min(1,max/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  cb(cv.toDataURL('image/jpeg',0.85));
 };
 img.src=URL.createObjectURL(file);
}
function uploadReportPhoto(){
 const scl=$('rpc');
 if(!scl) return alert('Please add a student first.');
 const cid=Number(scl.value),term=$('rpt').value.trim(),file=$('rpf').files[0];
 if(!term) return alert('Please enter the term.');
 if(!file) return alert('Please choose a photo.');
 resizeImage(file,1000,img=>{S.reportPhotos.push({cid,term,img});alert('Report card photo uploaded.');render();});
}
function deleteReportPhoto(i){
 if(!confirm('Delete this report card photo?')) return;
 S.reportPhotos.splice(i,1);render();
}
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function addTT(){
 const cls=$('tc').value,day=$('td').value,time=$('ttime').value.trim(),subject=$('tsub').value.trim();
 if(!time||!subject) return alert('Please enter the time and the activity.');
 S.timetable.push({cls,day,time,subject});alert('Timetable entry added.');render();
}
function deleteTT(i){
 if(!confirm('Delete this timetable entry?')) return;
 S.timetable.splice(i,1);render();
}

// ---- ADMIN DASHBOARD ----
function adminHTML(){
 return `<div class="card"><b>Admin Dashboard</b> <span class="muted">${esc(user.name)} · staff only</span></div>${nav(ATABS,tab,'goATab')}${aBody()}`;
}
function aBody(){
 switch(tab){
  case 'reports': return `<div class="card"><h2>Add report card entry</h2>
    <label>Student</label>${studentSelect('rc')}
    <label>Term</label><input id="rt" placeholder="e.g. Term 1 2026">
    <label>Subject / area</label><input id="rs" placeholder="e.g. English, Motor skills">
    <label>Marks or grade</label><input id="rg" placeholder="e.g. A, 85/100">
    <label>Remarks</label><input id="rm">
    <button onclick="addReport()">Add report entry</button></div>
    <div class="card"><h2>Upload report card photo</h2>
    <label>Student</label>${studentSelect('rpc')}
    <label>Term</label><input id="rpt" placeholder="e.g. Term 1 2026">
    <label>Photo of report card</label><input type="file" id="rpf" accept="image/*">
    <button onclick="uploadReportPhoto()">Upload photo</button></div>
    ${S.reportPhotos.map((p,i)=>{const ch=S.children.find(c=>c.id===p.cid);return `<div class="card"><b>${ch?esc(ch.name):'(deleted student)'}</b> · ${esc(p.term)}<img src="${p.img}" style="width:100%;border-radius:8px;margin-top:6px"><div><button class="alt" onclick="deleteReportPhoto(${i})">Delete photo</button></div></div>`}).join('')}
    ${S.reports.map((r,i)=>{const ch=S.children.find(c=>c.id===r.cid);return `<div class="card"><b>${ch?esc(ch.name):'(deleted student)'}</b> · ${esc(r.term)} · ${esc(r.subject)}: ${esc(r.grade)} <span class="muted">${esc(r.remarks)}</span> <button class="alt" onclick="deleteReport(${i})">Delete</button></div>`}).join('')}`;
  case 'concerns': return S.concerns.map((x,i)=>`<div class="card"><b>${esc(x.subject)}</b> <span class="muted">${esc(x.name)} · ${x.d}</span><p>${esc(x.message)}</p>
    ${x.reply?`<p><b>Your reply:</b> ${esc(x.reply)}</p>`:`<input id="rep${i}" placeholder="Write a reply"><button onclick="replyConcern(${i})">Send reply</button>`}
    <div><button class="alt" onclick="deleteConcern(${i})">Delete</button></div></div>`).join('')||none();
  case 'tt': return `<div class="card"><h2>Add timetable entry</h2>
    <label>Class</label>${sel('tc',CLASSES.slice(1))}
    <label>Day</label>${sel('td',DAYS)}
    <label>Time (e.g. 9:00 - 9:45 AM)</label><input id="ttime">
    <label>Activity / subject</label><input id="tsub">
    <button onclick="addTT()">Add to timetable</button></div>`
    + (S.timetable.map((t,i)=>`<div class="card"><b>${esc(t.cls)}</b> · ${t.day} · ${esc(t.time)} — ${esc(t.subject)} <button class="alt" onclick="deleteTT(${i})">Delete</button></div>`).join('')||none());
  case 'post': return `<div class="card"><h2>Post an update</h2>
    <label>Type</label>${sel('pt',['Announcement','Homework','Class Diary'])}
    <label>For class</label>${sel('pc',CLASSES)}
    <label>Title</label><input id="pti">
    <label>Message</label><textarea id="pb" rows="4"></textarea>
    <button onclick="postUpd()">Publish to parents</button></div>`;
  case 'stu': return stuForm(editId?S.children.find(c=>c.id===editId):null)
    + S.children.map(c=>`<div class="card" style="display:flex;align-items:center;gap:10px">${c.photo?`<img src="${c.photo}" style="width:44px;height:44px;border-radius:50%;object-fit:cover">`:''}<div style="flex:1"><b>${esc(c.name)}</b> <span class="muted">${esc(c.cls)} · login: ${esc(c.user)}</span></div><button class="alt" onclick="editStudent(${c.id})">Edit</button> <button class="alt" onclick="deleteStudent(${c.id})">Delete</button></div>`).join('')||none();
  case 'adm': return `<div class="card"><h2>Add admin</h2>
    <label>Name</label><input id="an">
    <label>Username</label><input id="au">
    <label>Password</label><input id="apw">
    <button onclick="addAdmin()">Add admin</button></div>`
    + S.admins.map(a=>adminRow(a.name,'Username: '+a.user,`deleteAdmin('${a.user}')`)).join('');
  case 'att': return `<div class="card"><label>Date</label><input type="date" value="${adate}" onchange="adate=this.value;render()"> <button class="alt" onclick="clearAtt()">Clear marks for this date</button>
    ${S.children.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0">
    <span>${esc(c.name)} <span class="muted">(${c.cls})</span></span>
    <select onchange="S.att[${c.id}+'|'+adate]=this.value">${[['','—'],['P','Present'],['A','Absent']].map(([v,l])=>`<option value="${v}" ${S.att[c.id+'|'+adate]===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')||'<p class="muted">Add students first.</p>'}</div>`;
  case 'fees': return `<div class="card"><h2>Add fee</h2><input id="fi" placeholder="Item (e.g. Term 3 Tuition)"><input id="fa" placeholder="Amount (e.g. ₹12,000)"><label>Due date</label><input type="date" id="fd"><button onclick="addFee()">Add</button></div>`
    + S.fees.map((f,i)=>`<div class="card">${esc(f.term)} — ${esc(f.amt)} · due ${f.due} · <b>${f.status}</b> <button class="alt" onclick="toggleFee(${i})">Mark ${f.status==='Paid'?'pending':'paid'}</button> <button class="alt" onclick="deleteFee(${i})">Delete</button></div>`).join('');
  case 'forms': return `<div class="card"><h2>Create form</h2><input id="xt" placeholder="Form title"><input id="xf" placeholder="Questions, separated by commas"><button onclick="addForm()">Create form</button></div>`
    + S.forms.map(f=>adminRow(f.title,f.fields.join(' · '),`deleteForm(${f.id})`)).join('');
  case 'gal': return `<div class="card"><h2>Upload photo</h2><label>For class</label>${sel('gc',CLASSES)}<input id="gcap" placeholder="Caption"><input type="file" id="gf" accept="image/*"><button onclick="addPhoto()">Upload</button></div>
    <div class="grid">${S.gallery.map((g,i)=>`<div><img class="g" src="${g.src}"><div class="muted">${esc(g.cap)} (${g.cls})</div><button class="alt" onclick="deletePhoto(${i})">Delete</button></div>`).join('')}</div>`;
  case 'leaves': return S.leaves.map((l,i)=>`<div class="card"><b>${esc(l.name)}</b> <span class="muted">${l.from} → ${l.to}</span><p>${esc(l.reason)}</p><span class="tag">${l.status}</span>
    ${l.status==='Pending'?`<div><button onclick="decide(${i},'Approved')">Approve</button> <button class="alt" onclick="decide(${i},'Rejected')">Reject</button></div>`:''}</div>`).join('')||none();
  case 'resp': return S.responses.map(r=>card(`${r.name} — ${S.forms.find(f=>f.id===r.fid)?.title||'Form'}`,r.d,r.fields.map((x,i)=>x+': '+r.answers[i]).join(' | '))).join('')||none();
 }
}
function addStudent(){
 const name=$('sn').value.trim(),cls=$('sc').value,un=$('su').value.trim().toLowerCase(),pw=$('spw').value;
 if(!name||!un||!pw) return alert('Please fill in name, username and password.');
 if(taken(un)) return alert('That username is already in use. Please choose another.');
 S.children.push({id:Date.now(),user:un,pass:pw,name,cls,photo:tmpPhoto||null});tmpPhoto=null;
 alert('Student added. Parents can now log in with this username.');render();
}
function addAdmin(){
 const name=$('an').value.trim(),un=$('au').value.trim().toLowerCase(),pw=$('apw').value;
 if(!name||!un||!pw) return alert('Please fill in name, username and password.');
 if(taken(un)) return alert('That username is already in use. Please choose another.');
 S.admins.push({user:un,pass:pw,name});
 alert('Admin added.');render();
}
function postUpd(){
 const t=$('pt').value,ti=$('pti').value.trim(),b=$('pb').value.trim(),c=$('pc').value;
 if(!ti) return alert('Please add a title.');
 const item={t:ti,b,cls:c,d:today()};
 if(t==='Announcement') S.announcements.unshift(item);
 else if(t==='Homework') S.homework.unshift(item);
 else S.diary.unshift(item);
 alert('Published to parents!');render();
}
function addFee(){
 const term=$('fi').value.trim(),amt=$('fa').value.trim(),due=$('fd').value;
 if(!term) return alert('Please enter the fee item.');
 S.fees.push({term,amt,due,status:'Pending'});render();
}
function toggleFee(i){S.fees[i].status=S.fees[i].status==='Paid'?'Pending':'Paid';render();}
function addForm(){
 const title=$('xt').value.trim(),fields=$('xf').value.split(',').map(s=>s.trim()).filter(Boolean);
 if(!title||!fields.length) return alert('Add a title and at least one question.');
 S.forms.push({id:Date.now(),title,fields});render();
}
function addPhoto(){
 const file=$('gf').files[0];
 if(!file) return alert('Please choose a photo first.');
 const cap=$('gcap').value.trim(),cls=$('gc').value,r=new FileReader();
 r.onload=()=>{S.gallery.unshift({src:r.result,cap,cls,d:today()});render();};
 r.readAsDataURL(file);
}
function decide(i,status){S.leaves[i].status=status;render();}

// ---- DELETE OPTIONS ----
function adminRow(t,s,fn){return `<div class="card"><b>${esc(t)}</b> <span class="muted">${esc(s)}</span><div><button class="alt" onclick="${fn}">Delete</button></div></div>`;}
function deleteStudent(id){
 if(!confirm('Delete this student? Their login will stop working.')) return;
 S.children=S.children.filter(c=>c.id!==id);
 for(const k in S.att) if(k.startsWith(id+'|')) delete S.att[k];
 render();
}
function deleteAdmin(un){
 if(un===user.user) return alert("You can't delete the account you're logged in with.");
 if(S.admins.length<=1) return alert('You must keep at least one admin.');
 if(!confirm('Delete this admin account?')) return;
 S.admins=S.admins.filter(a=>a.user!==un);
 render();
}
function clearAtt(){
 if(!confirm('Clear all attendance marks for this date?')) return;
 for(const k in S.att) if(k.endsWith('|'+adate)) delete S.att[k];
 render();
}
function deleteFee(i){
 if(!confirm('Delete this fee?')) return;
 S.fees.splice(i,1);render();
}
function deleteForm(id){
 if(!confirm('Delete this form and all its replies?')) return;
 S.forms=S.forms.filter(f=>f.id!==id);
 S.responses=S.responses.filter(r=>r.fid!==id);
 render();
}
function deletePhoto(i){
 if(!confirm('Delete this photo?')) return;
 S.gallery.splice(i,1);render();
}

// ---- MAIN ----
// ---- SAVED DATA & LOGIN MEMORY (kept on this device) ----
const KEY='mmp_session', DKEY='mmp_data';
let editId=null,tmpPhoto=null;
function saveSession(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function saveData(){try{localStorage.setItem(DKEY,JSON.stringify(S));}catch(e){}}
function loadData(){try{const d=JSON.parse(localStorage.getItem(DKEY)||'null');if(d)Object.assign(S,d);}catch(e){}}
function restoreSession(){
 let s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
 if(!s) return;
 if(s.t==='p'){const c=S.children.find(x=>x.id===s.id);if(c){user=c;view='profile';}}
 else if(s.t==='a'){const a=S.admins.find(x=>x.user===s.u);if(a){user={admin:true,name:a.name,user:a.user};view='admin';tab='post';}}
 if(!user){try{localStorage.removeItem(KEY);}catch(e){}}
}
function render(){
 saveData();
 $('outBtn').style.display=user?'inline-block':'none';
 $('app').innerHTML = view==='login' ? loginHTML() : view==='profile' ? profileHTML() : view==='parent' ? parentHTML() : adminHTML();
 if(view==='login') bindLogin();
 if(view==='profile') $('enter').addEventListener('click',()=>{view='parent';tab='menu';render();});
}
function bindLogin(){
 $('rp').addEventListener('click',()=>{role='parent';msg='';render();});
 $('ra').addEventListener('click',()=>{role='admin';msg='';render();});
 $('lg').addEventListener('click',login);
 $('p').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
}
// Welcome card shown to a parent who is already signed in on this device
function profileHTML(){
 const c=user, logo=document.querySelector('header img').src;
 const av=c.photo
  ? `<img src="${c.photo}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #fff">`
  : `<div style="width:72px;height:72px;border-radius:50%;background:#fff;color:#1d6b7b;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold">${esc(c.name.charAt(0).toUpperCase())}</div>`;
 return `<div style="text-align:center;margin-top:10px"><img src="${logo}" alt="Miracle Minds logo" style="height:150px"></div>
 <div id="enter" style="cursor:pointer;margin-top:24px;background:linear-gradient(90deg,#1d6b7b,#0f4f5c);color:#fff;border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;border-bottom:4px solid #f9c33a;box-shadow:0 2px 8px #0003">
  ${av}
  <div style="flex:1"><div style="font-size:18px;font-weight:bold">${esc(c.name)}</div><div>Class: ${esc(c.cls)}</div></div>
  <div style="font-size:26px;color:#f9c33a">→</div>
 </div>`;

// Admin: add or edit a student
function stuForm(c){
 const isEdit=!!c;
 return `<div class="card"><h2>${isEdit?'Edit student':'Add student'}</h2>
  <label>Child's name</label><input id="sn" value="${isEdit?esc(c.name):''}">
  <label>Class</label>${sel('sc',CLASSES.slice(1),isEdit?c.cls:undefined)}
  <label>Username (for child login)</label><input id="su" value="${isEdit?esc(c.user):''}">
  <label>Password</label><input id="spw" value="${isEdit?esc(c.pass):''}">
  <label>Photo ${isEdit?'(leave empty to keep the current photo)':''}</label><input type="file" id="sp" accept="image/*" onchange="pickPhoto(this)">
  <button onclick="${isEdit?'saveStudent('+c.id+')':'addStudent()'}">${isEdit?'Save changes':'Add student'}</button>
  ${isEdit?' <button class="alt" onclick="editId=null;render()">Cancel</button>':''}</div>`;
}
function pickPhoto(input){
 const f=input.files[0]; if(!f) return;
 const img=new Image();
 img.onload=()=>{
  const k=Math.min(1,300/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  tmpPhoto=cv.toDataURL('image/jpeg',0.8);
 };
 img.src=URL.createObjectURL(f);
}
function editStudent(id){editId=id;tmpPhoto=null;render();}
function saveStudent(id){
 const c=S.children.find(x=>x.id===id);
 const name=$('sn').value.trim(),cls=$('sc').value,un=$('su').value.trim().toLowerCase(),pw=$('spw').value;
 if(!name||!un||!pw) return alert('Please fill in name, username and password.');
 if(S.children.some(x=>x.user===un&&x.id!==id)||S.admins.some(a=>a.user===un)) return alert('That username is already in use.');
 Object.assign(c,{name,cls,user:un,pass:pw});
 if(tmpPhoto) c.photo=tmpPhoto;
 tmpPhoto=null;editId=null;
 alert('Student updated.');render();
}

loadData();
restoreSession();
render();
